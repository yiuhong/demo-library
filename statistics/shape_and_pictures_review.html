    <style>
        /*
         * End-of-track self-test for Shape and pictures. Questions, the
         * score, and the item review are one commentary card. Hidden
         * sizers share that card's grid cell and reserve the height of
         * the tallest Learn state, so a shorter state leaves empty
         * space inside the card and the page length stays put. The
         * score sizer includes the completion card, the tall score
         * state, and question 1 includes its opening note. Teach hides
         * the questions and keeps the same slot,
         * with the notice at the top. Previous, Next, and a slot for
         * Try again are the last row of that card, so the text above
         * them can change without moving the buttons. The page is the
         * scroller. The card does not scroll.
         */
        body.demo-page {
            margin: 0;
        }

        .page {
            box-sizing: border-box;
            width: 100%;
            max-width: 40rem;
            margin: 0 auto;
            padding: 1rem 1rem 2.5rem;
        }

        .page *,
        .page *::before,
        .page *::after {
            box-sizing: border-box;
        }

        .page-title {
            margin-bottom: 0;
        }

        .demo-topbar > .demo-back {
            box-sizing: border-box;
            min-height: 44px;
            max-width: 100%;
        }

        .review-slot {
            display: grid;
            margin: 1rem 0 0;
        }

        .review-slot > .mode-notice,
        .review-slot > .review {
            grid-area: 1 / 1;
        }

        .mode-notice {
            align-self: start;
            justify-self: stretch;
            margin: 0;
            padding: 0.9rem 1rem;
            line-height: 1.45;
            z-index: 1;
        }

        html:not(.viz-teach) .mode-notice {
            display: none;
        }

        .review {
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 1rem 1rem 1.1rem;
            overflow: visible;
            min-width: 0;
        }

        #review {
            align-self: stretch;
        }

        .review-body {
            flex: 0 1 auto;
            min-width: 0;
        }

        #review > .review-body {
            flex: 1 1 auto;
        }

        .review-sizer {
            visibility: hidden;
            align-self: start;
            justify-self: stretch;
            pointer-events: none;
            user-select: none;
            overflow: visible;
        }

        .review-stem,
        .hint,
        .section-heading,
        .section-line,
        .score-note,
        .source {
            margin: 0;
            line-height: 1.45;
            overflow-wrap: break-word;
        }

        .opening-note {
            margin: 0 0 0.85rem;
            line-height: 1.45;
            overflow-wrap: break-word;
        }

        /*
         * The opening note is commentary, so Teach hides it on the live
         * card. The hidden sizer keeps that line in the flow. The
         * reserved height still includes question 1 with the note, and
         * the page does not jump.
         */
        html.viz-teach .review-sizer .opening-note {
            display: block !important;
        }

        .step-kicker {
            margin: 0 0 0.45rem;
            font-size: 0.82rem;
            font-weight: bold;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .step-kicker:focus,
        .step-kicker:focus-visible {
            outline: none;
        }

        .ask {
            width: 100%;
            min-width: 0;
            margin: 0;
            padding: 0;
            border: 0;
        }

        .ask legend {
            display: block;
            width: 100%;
            margin: 0 0 0.85rem;
            padding: 0;
            font-size: 1.05rem;
            font-weight: bold;
            line-height: 1.4;
            overflow-wrap: break-word;
        }

        .choice {
            display: flex;
            align-items: flex-start;
            gap: 0.65rem;
            width: 100%;
            margin: 0.45rem 0 0;
            padding: 0.65rem 0.75rem;
            border: 1px solid #000000;
            background: #ffffff;
            color: #000000;
            font-size: 1rem;
            line-height: 1.4;
            cursor: pointer;
            overflow-wrap: break-word;
        }

        .choice input {
            appearance: none;
            flex: 0 0 auto;
            width: 1.25rem;
            height: 1.25rem;
            margin: 0.15rem 0 0;
            border: 2px solid currentColor;
            border-radius: 50%;
            background: #ffffff;
        }

        .choice.is-selected {
            background: #000000;
            color: #ffffff;
        }

        .choice.is-selected input {
            border-color: #ffffff;
            background: #ffffff;
            box-shadow: inset 0 0 0 0.28rem #000000;
        }

        .choice:focus-within {
            outline: 2px solid #000000;
            outline-offset: 3px;
        }

        .choice-text {
            min-width: 0;
        }

        .hint {
            margin-top: 0.85rem;
        }

        .score-line {
            margin: 0 0 0.85rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        .score {
            margin: 0.2rem 0 0.75rem;
            font-size: 1.75rem;
            font-weight: bold;
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
        }


        .score-encourage {
            margin: 0 0 0.85rem;
            max-width: 28em;
            font-size: 1.05rem;
            line-height: 1.45;
        }

        .review-stem {
            margin-bottom: 0.85rem;
            font-weight: bold;
        }

        .answer-block {
            margin: 0.55rem 0 0;
            padding: 0.65rem 0.75rem;
            border: 1px solid #000000;
            background: #ffffff;
            line-height: 1.4;
            overflow-wrap: break-word;
        }

        .answer-block .k {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.35rem 0.65rem;
            margin-bottom: 0.2rem;
            font-size: 0.78rem;
            font-weight: bold;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .review .answer-block.is-correct {
            border-color: #0b5f1e;
            background: #e7f6ea;
            color: #0b5f1e;
        }

        .review .answer-block.is-incorrect {
            border-color: #8e1212;
            background: #fde8e8;
            color: #8e1212;
        }

        .section-heading {
            margin: 0.15rem 0 0.3rem;
            font-size: 1rem;
            font-weight: bold;
        }

        .section-line + .section-line {
            margin-top: 0.15rem;
        }

        .score-note,
        .source {
            margin-top: 0.85rem;
        }

        @media (forced-colors: active) {
            .review .answer-block.is-correct,
            .review .answer-block.is-incorrect {
                border-color: CanvasText;
                background: Canvas;
                color: CanvasText;
            }
        }

        .source a {
            color: #000000;
            font-weight: bold;
        }

        /*
         * Three equal slots on a wide card: Previous, Next, and Try
         * again. The third slot stays in the layout when Try again is
         * not shown, so Next does not move. A narrow card stacks the
         * same three slots and keeps that taller bar on every step.
         */
        .nav {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            flex: 0 0 auto;
            gap: 0.55rem;
            margin-top: 1rem;
        }

        .nav .demo-btn {
            width: 100%;
            min-width: 0;
            white-space: nowrap;
        }

        .nav .demo-btn.is-reserved {
            visibility: hidden;
            pointer-events: none;
        }

        .nav .demo-btn:disabled {
            opacity: 0.45;
            cursor: default;
        }

        .nav .demo-btn:disabled:hover {
            background: #ffffff !important;
            color: #000000 !important;
        }

        .nav .demo-btn.demo-btn-primary:disabled:hover {
            background: #000000 !important;
            color: #ffffff !important;
        }

        .hint[hidden] {
            display: none !important;
        }

        .needs-js {
            margin: 1rem 0 0;
            line-height: 1.45;
        }

        @media (max-width: 736px), (pointer: coarse) {
            .choice,
            .nav .demo-btn,
            .source a {
                min-height: 44px;
            }

            .nav {
                grid-template-columns: minmax(0, 1fr);
            }

            .nav .demo-btn {
                width: 100%;
            }

            .source a {
                display: inline-flex;
                align-items: center;
            }
        }
    </style>

<body class="demo-page">
    <div class="page">
        <div class="demo-topbar">
            <a class="demo-back" href="../book/chapter-1.html#shape-and-pictures">Exit</a>
        </div>

        <header class="demo-header page-title">
            <h1>Self-test: Shape and pictures</h1>
        </header>

        <div id="review-slot" class="review-slot">
            <p class="mode-notice demo-card" data-teach="essential">Switch to Learn mode for self-test questions.</p>
            <div id="review" class="review demo-card" data-teach="detail"></div>
        </div>
        <noscript><p class="needs-js">This review needs JavaScript.</p></noscript>
    </div>

    <script src="../assets/shape-complete-pdf.js"></script>
    <script>
        (function () {
            /*
             * selections, cursor, and finished are the attempt.
             * Teach only hides #review. The slot and its sizers stay,
             * so the page length does not change, and the questions
             * stay hidden. This script does not read viz-teach, and
             * it does not clear the attempt when the mode changes.
             * Try again is the reset. Nothing is stored. A high score
             * can download a PDF; that file is the only record.
             */
            var QUESTIONS = [
                {
                    demo: "skewed_distribution.html",
                    demoTitle: "Skewed Distribution",
                    stem: "A long tail on one side of a set of numbers pulls which average toward itself?",
                    choices: [
                        "The mean, so the mean, the median, and the mode sit in different places.",
                        "The median only, so the mean and the mode stay together.",
                        "The mode only, so the mean stays at the center of the tail.",
                        "None of them. The three averages stay in one place."
                    ],
                    answer: 0
                },
                {
                    demo: "skewed_distribution.html",
                    demoTitle: "Skewed Distribution",
                    stem: "The number for skew is which average?",
                    choices: [
                        "The interquartile range, Q₃ − Q₁.",
                        "The bandwidth h of a kernel.",
                        "The average of cubed standardized deviations, (1/n) Σ ((xᵢ − x̄) / σ)³.",
                        "The distance from a point to the nearer 1.5 × IQR fence."
                    ],
                    answer: 2
                },
                {
                    demo: "skewed_distribution.html",
                    demoTitle: "Skewed Distribution",
                    stem: "A Q–Q plot of a positively skewed distribution against a normal curve bends upward. What drives that bend?",
                    choices: [
                        "The skewed density being taller than the normal density.",
                        "The horizontal gap on the cumulative curve widening as you move up the percentiles.",
                        "The histogram bin edges moving while the numbers stay the same.",
                        "The bandwidth of the kernel increasing."
                    ],
                    answer: 1
                },
                {
                    demo: "boxplot_histogram.html",
                    demoTitle: "Boxplot and Histogram",
                    stem: "For one sample, what do the histogram and the boxplot show?",
                    choices: [
                        "The histogram shows how the values pile up. The boxplot packs the center and the spread into a box and whiskers.",
                        "The histogram is a smooth kernel density. The boxplot is a Q–Q plot.",
                        "Both pictures mark 1.5 × IQR fences and nothing else.",
                        "The boxplot shows bin counts. The histogram shows only the median."
                    ],
                    answer: 0
                },
                {
                    demo: "boxplot_histogram.html",
                    demoTitle: "Boxplot and Histogram",
                    stem: "The interquartile range is which difference?",
                    choices: [
                        "The maximum minus the minimum.",
                        "The mean minus the median.",
                        "The upper fence minus the lower fence.",
                        "Q₃ − Q₁."
                    ],
                    answer: 3
                },
                {
                    demo: "boxplot_outliers.html",
                    demoTitle: "Boxplot and Outliers",
                    stem: "Under Tukey’s 1.5 × IQR fence rule, a point counts as an outlier when it falls where?",
                    choices: [
                        "More than one bin away from the tallest bar.",
                        "Past the fence Q₁ − 1.5 × IQR, or past the fence Q₃ + 1.5 × IQR.",
                        "Outside the bandwidth of the Gaussian kernel.",
                        "Anywhere the density is lower than a normal curve."
                    ],
                    answer: 1
                },
                {
                    demo: "boxplot_outliers.html",
                    demoTitle: "Boxplot and Outliers",
                    stem: "In a Tukey boxplot, where do the whiskers stop, and how is a point past a fence shown?",
                    choices: [
                        "The whiskers stop at the fences, and points past the fences are drawn on their own.",
                        "The whiskers run from the smallest value to the largest value, and no point is drawn apart.",
                        "The whiskers are the kernel on each point, and the box is the bandwidth.",
                        "The whiskers mark the mean and the mode."
                    ],
                    answer: 0
                },
                {
                    demo: "kde_plots.html",
                    demoTitle: "Kernel Density Estimate (KDE)",
                    stem: "If the histogram’s bin edges move and the numbers stay the same, what happens?",
                    choices: [
                        "The bars stay fixed, and the kernel density curve moves with the bin edges.",
                        "Both the bars and the kernel density curve are drawn from a new sample.",
                        "The bars can change height, and the kernel density curve stays as it is.",
                        "The quartiles in the box move with the bin edges."
                    ],
                    answer: 2
                },
                {
                    demo: "kde_plots.html",
                    demoTitle: "Kernel Density Estimate (KDE)",
                    stem: "In a kernel density estimate, the bandwidth h is what?",
                    choices: [
                        "The number of bins in the histogram.",
                        "How wide each kernel is. A narrow kernel keeps the spikes, and a wide one flattens them.",
                        "The sample size n.",
                        "The multiple 1.5 in the Tukey fence."
                    ],
                    answer: 1
                },
                {
                    demo: "kde_plots.html",
                    demoTitle: "Kernel Density Estimate (KDE)",
                    stem: "The violin and the cloud in a raincloud plot are what?",
                    choices: [
                        "A second sample, drawn again on its own.",
                        "A Q–Q plot of the sample against a normal curve.",
                        "The fences, drawn as a curve instead of as lines.",
                        "The same smooth curve. The violin is that curve, and a half of it is the cloud in a raincloud plot."
                    ],
                    answer: 3
                }
            ];

            var LAST = QUESTIONS.length - 1;
            var SCORE = QUESTIONS.length;
            var REVIEW = QUESTIONS.length + 1;
            var PASS = 8;
            var OPENING_NOTE = "Score 8 or more out of 10 to get a bookmark you can download.";
            var MONTHS = [
                "January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"
            ];
            var selections = QUESTIONS.map(function () { return null; });
            var cursor = 0;
            var finished = false;
            var attemptWhen = null;
            var pdfBusy = false;
            var review = document.getElementById("review");
            var slot = document.getElementById("review-slot");

            function formatDate(date) {
                return date.getDate() + " " + MONTHS[date.getMonth()] + " " + date.getFullYear();
            }

            function attemptDateText() {
                if (!attemptWhen) attemptWhen = new Date();
                return formatDate(attemptWhen);
            }

            function el(name, attrs) {
                var node = document.createElement(name);
                if (!attrs) return node;
                Object.keys(attrs).forEach(function (key) {
                    if (key === "class") node.className = attrs[key];
                    else node.setAttribute(key, attrs[key]);
                });
                return node;
            }

            function addText(parent, tag, className, text) {
                var node = el(tag, className ? { "class": className } : null);
                node.textContent = text;
                parent.appendChild(node);
                return node;
            }

            function allAnswered() {
                var i;
                for (i = 0; i < selections.length; i++) {
                    if (selections[i] == null) return false;
                }
                return true;
            }

            function score() {
                var n = 0;
                var i;
                for (i = 0; i < QUESTIONS.length; i++) {
                    if (selections[i] === QUESTIONS[i].answer) n += 1;
                }
                return n;
            }

            function scoreText() {
                return score() + " out of 10";
            }

            /*
             * The four demonstrations are the sections. Each line is
             * that demonstration's count correct over its questions.
             */
            function sectionGroups() {
                var groups = [];
                var byTitle = {};
                var i;
                for (i = 0; i < QUESTIONS.length; i++) {
                    var title = QUESTIONS[i].demoTitle;
                    if (!byTitle[title]) {
                        byTitle[title] = { title: title, indexes: [] };
                        groups.push(byTitle[title]);
                    }
                    byTitle[title].indexes.push(i);
                }
                return groups;
            }

            function sectionLines() {
                var groups = sectionGroups();
                var lines = [];
                var i;
                for (i = 0; i < groups.length; i++) {
                    var correct = 0;
                    var j;
                    var indexes = groups[i].indexes;
                    for (j = 0; j < indexes.length; j++) {
                        var index = indexes[j];
                        if (selections[index] === QUESTIONS[index].answer) correct += 1;
                    }
                    lines.push(groups[i].title + ": " + correct + "/" + indexes.length);
                }
                return lines;
            }

            function answerBlock(kind, label, text) {
                var block = el("div", { "class": "answer-block is-" + kind });
                addText(block, "span", "k", label);
                addText(block, "span", "answer-text", text);
                return block;
            }

            function widestSectionLines() {
                return sectionGroups().map(function (group) {
                    var count = group.indexes.length;
                    return group.title + ": " + count + "/" + count;
                });
            }

            function maxCursor() {
                return finished ? REVIEW + LAST : LAST;
            }

            function canForward() {
                if (cursor < LAST) return selections[cursor] != null;
                if (cursor === LAST) return allAnswered();
                return finished && cursor < REVIEW + LAST;
            }

            function withEmbed(href) {
                if (!/[?&]embed=shell(?:&|$)/.test(location.search)) return href;
                return href + (href.indexOf("?") === -1 ? "?" : "&") + "embed=shell";
            }

            function button(action, label, primary) {
                var node = el("button", {
                    type: "button",
                    "class": primary ? "demo-btn demo-btn-primary" : "demo-btn",
                    "data-action": action
                });
                node.textContent = label;
                return node;
            }

            /*
             * Try again shows on the score and on the last review
             * item (Review 10 of 10). Earlier review items and the
             * questions do not show it. The button stays in the bar
             * either way, so Previous and Next do not move.
             */
            function tryAgainHere() {
                return cursor === SCORE || cursor === REVIEW + LAST;
            }

            function navBar(nextLabel) {
                var bar = el("div", { "class": "nav" });
                bar.appendChild(button("prev", "Previous", false));
                bar.appendChild(button("next", nextLabel, true));
                bar.appendChild(button("again", "Try again", false));
                return bar;
            }

            function mount(parent, nextLabel, fill) {
                var body = el("div", { "class": "review-body" });
                fill(body);
                parent.appendChild(body);
                parent.appendChild(navBar(nextLabel));
            }

            function stepHeading(parent, text, live) {
                var node = addText(parent, "h2", "step-kicker", text);
                if (!live) return node;
                node.id = "review-heading";
                node.tabIndex = -1;
                return node;
            }

            function fillQuiz(parent, index, hintText, live, withOpening) {
                mount(parent, index === LAST ? "Score" : "Next", function (body) {
                    var item = QUESTIONS[index];
                    /*
                     * Learn only, and only on question 1. Later questions,
                     * the score, and the review omit it. Try again returns
                     * to question 1, so it shows again. Teach hides it with
                     * the rest of the commentary.
                     */
                    if (withOpening || (live && index === 0)) {
                        var note = addText(body, "p", "opening-note", OPENING_NOTE);
                        note.setAttribute("data-teach", "detail");
                    }
                    stepHeading(body, "Question " + (index + 1) + " of 10", live);
                    var field = el("fieldset", { "class": "ask" });
                    var legend = el("legend");
                    legend.textContent = item.stem;
                    field.appendChild(legend);
                    item.choices.forEach(function (choice, choiceIndex) {
                        var label = el("label", { "class": "choice" });
                        var input = el("input", {
                            type: "radio",
                            name: live ? "shape-review-answer" : "shape-review-sizer-" + index + (withOpening ? "-note" : ""),
                            value: String(choiceIndex)
                        });
                        if (live && selections[index] === choiceIndex) {
                            input.checked = true;
                            label.classList.add("is-selected");
                        }
                        var text = el("span", { "class": "choice-text" });
                        text.textContent = choice;
                        label.appendChild(input);
                        label.appendChild(text);
                        field.appendChild(label);
                    });
                    body.appendChild(field);
                    var hint = addText(body, "p", "hint", hintText);
                    hint.setAttribute("data-role", "hint");
                    if (!hintText) hint.hidden = true;
                });
            }

            function completionCard(dateText) {
                var card = el("article", { "class": "complete-card" });
                var sheet = el("div", { "class": "complete-sheet" });
                addText(sheet, "p", "complete-kicker", "Project Viz");
                addText(sheet, "h3", "complete-title", "Well done!");
                addText(sheet, "p", "complete-finish", "You have finished the section:");
                addText(sheet, "p", "complete-track", "Shape and pictures");
                addText(sheet, "p", "complete-date", dateText);
                var row = el("div", { "class": "complete-score-row" });
                var stamp = el("div", { "class": "complete-seal" });
                var img = el("img", { "class": "complete-seal-img", alt: "", "aria-hidden": "true" });
                stamp.appendChild(img);
                addText(stamp, "span", "complete-seal-word", "COMPLETED");
                row.appendChild(stamp);
                sheet.appendChild(row);
                card.appendChild(sheet);
                var download = el("button", {
                    type: "button",
                    "class": "complete-download",
                    "data-action": "pdf"
                });
                download.textContent = "Download as PDF";
                card.appendChild(download);
                if (window.ShapeCompletePdf && window.ShapeCompletePdf.applyCard) {
                    window.ShapeCompletePdf.applyCard(card, "shape-and-pictures");
                }
                return card;
            }

            /*
             * The score line stays on this step. Eight or more also shows
             * the bookmark, without that score. Seven or fewer adds one
             * sentence and does not show the bookmark. The sizer always
             * uses the bookmark, with the longest date, so the reserved
             * height covers that sheet.
             */
            function fillScore(parent, lines, live) {
                var n = live ? score() : 10;
                mount(parent, "Next", function (body) {
                    stepHeading(body, "Score", live);
                    var number = addText(body, "p", "score", n + " out of 10");
                    if (live) number.setAttribute("aria-live", "polite");
                    if (n >= PASS) {
                        body.appendChild(completionCard(
                            live ? attemptDateText() : "30 September 2026"
                        ));
                    } else {
                        addText(body, "p", "score-encourage", "A good start. Review the answers, then try again.");
                    }
                    addText(body, "h3", "section-heading", "Breakdown");
                    var i;
                    for (i = 0; i < lines.length; i++) {
                        addText(body, "p", "section-line", lines[i]);
                    }
                    addText(body, "p", "score-note", "Next reviews the answers.");
                });
            }

            function fillReview(parent, index, picked, live) {
                mount(parent, "Next", function (body) {
                    var item = QUESTIONS[index];
                    stepHeading(body, "Review " + (index + 1) + " of 10", live);
                    addText(body, "p", "score-line", "Score: " + (live ? scoreText() : "10 out of 10"));
                    addText(body, "p", "review-stem", item.stem);
                    if (picked === item.answer) {
                        body.appendChild(answerBlock("correct", "YOUR ANSWER IS CORRECT", item.choices[picked]));
                    } else {
                        body.appendChild(answerBlock(
                            "incorrect",
                            "YOUR ANSWER IS INCORRECT",
                            picked == null ? "No answer selected." : item.choices[picked]
                        ));
                        body.appendChild(answerBlock("correct", "Correct answer", item.choices[item.answer]));
                    }
                    var source = el("p", { "class": "source" });
                    source.appendChild(document.createTextNode("Demonstration: "));
                    var link = el("a", { href: live ? withEmbed(item.demo) : item.demo });
                    link.textContent = item.demoTitle;
                    if (!live) link.tabIndex = -1;
                    source.appendChild(link);
                    body.appendChild(source);
                });
            }

            function addSizer(kind, index, picked, hintText, withOpening) {
                var node = el("div", {
                    "class": "review review-sizer demo-card",
                    "aria-hidden": "true"
                });
                node.inert = true;
                if (kind === "quiz") fillQuiz(node, index, hintText, false, withOpening);
                else if (kind === "score") fillScore(node, widestSectionLines(), false);
                else fillReview(node, index, picked, false);
                var controls = node.querySelectorAll("button, input, a");
                var i;
                for (i = 0; i < controls.length; i++) {
                    controls[i].tabIndex = -1;
                    if (controls[i].tagName !== "A") controls[i].disabled = true;
                }
                slot.appendChild(node);
            }

            /*
             * One sizer for each question, each wrong-answer review
             * (the correct answer and the demonstration link), and the
             * score. The last question's sizer includes the line that
             * can show when that answer is in and earlier ones are not.
             * Other questions do not reserve a line under the choices.
             * Question 1's sizer includes the opening note, that
             * question, and the action bar. The note shows only there.
             * Every sizer includes the three-slot action bar, so the
             * reserved height covers Try again on the score and on the
             * last item, and the completion card on the score. The slot
             * is as tall as the tallest of these.
             */
            function buildSizers() {
                var q;
                var i;
                for (q = 0; q < QUESTIONS.length; q++) {
                    addSizer(
                        "quiz",
                        q,
                        null,
                        q === LAST ? "Answer all ten questions to see the score." : "",
                        q === 0
                    );
                    for (i = 0; i < QUESTIONS[q].choices.length; i++) {
                        if (i === QUESTIONS[q].answer) continue;
                        addSizer("review", q, i, "");
                    }
                }
                addSizer("score", 0, null, "");
            }

            function syncChrome() {
                var prev = review.querySelector("[data-action='prev']");
                var next = review.querySelector("[data-action='next']");
                var again = review.querySelector("[data-action='again']");
                if (prev) prev.disabled = cursor === 0;
                if (next) next.disabled = !canForward();
                if (again) {
                    var showAgain = tryAgainHere();
                    again.classList.toggle("is-reserved", !showAgain);
                    again.disabled = !showAgain;
                    again.setAttribute("aria-hidden", showAgain ? "false" : "true");
                }
                if (cursor > LAST) return;
                var hint = review.querySelector("[data-role='hint']");
                var message = "";
                if (cursor === LAST && selections[cursor] != null && !allAnswered()) {
                    message = "Answer all ten questions to see the score.";
                }
                if (hint) {
                    hint.hidden = !message;
                    hint.textContent = message;
                }
            }

            function paintSelected() {
                var labels = review.querySelectorAll(".choice");
                var i;
                for (i = 0; i < labels.length; i++) {
                    var input = labels[i].querySelector("input");
                    var on = Number(input.value) === selections[cursor];
                    input.checked = on;
                    labels[i].classList.toggle("is-selected", on);
                }
            }

            function render(moveFocus) {
                while (review.firstChild) review.removeChild(review.firstChild);
                if (cursor < SCORE) fillQuiz(review, cursor, "", true);
                else if (cursor === SCORE) fillScore(review, sectionLines(), true);
                else fillReview(review, cursor - REVIEW, selections[cursor - REVIEW], true);
                syncChrome();
                if (!moveFocus) return;
                var heading = document.getElementById("review-heading");
                if (heading) heading.focus();
            }

            function go(delta) {
                if (delta > 0 && !canForward()) return;
                var next = cursor + delta;
                if (next < 0) return;
                if (cursor === LAST && next === SCORE && allAnswered()) {
                    finished = true;
                    if (!attemptWhen) attemptWhen = new Date();
                }
                if (next > maxCursor()) return;
                cursor = next;
                render(true);
            }

            review.addEventListener("change", function (event) {
                var input = event.target;
                if (!input || input.name !== "shape-review-answer") return;
                if (cursor > LAST) return;
                var value = Number(input.value);
                if (value !== value || value < 0 || value >= QUESTIONS[cursor].choices.length) return;
                selections[cursor] = value;
                paintSelected();
                syncChrome();
            });

            review.addEventListener("click", function (event) {
                var target = event.target;
                var control = target && target.closest ? target.closest("[data-action]") : null;
                if (!control || !review.contains(control)) return;
                var action = control.getAttribute("data-action");
                if (action === "prev") go(-1);
                else if (action === "next") go(1);
                else if (action === "again") {
                    selections = QUESTIONS.map(function () { return null; });
                    finished = false;
                    attemptWhen = null;
                    pdfBusy = false;
                    cursor = 0;
                    render(true);
                } else if (action === "pdf") downloadCompletion();
            });

            function downloadCompletion() {
                if (pdfBusy || cursor !== SCORE || score() < PASS) return;
                var pdf = window.ShapeCompletePdf;
                var button = review.querySelector("[data-action='pdf']");
                if (!pdf || !button) return;
                var info = {
                    date: attemptDateText(),
                    score: score(),
                    trackId: "shape-and-pictures"
                };
                function write(fonts) {
                    pdf.save(pdf.build(info, fonts));
                }
                var ready = pdf.ready();
                if (ready) {
                    try {
                        write(ready);
                    } catch (error) {
                        button.textContent = "Could not make the PDF";
                    }
                    return;
                }
                pdfBusy = true;
                button.disabled = true;
                pdf.load().then(function (fonts) {
                    write(fonts);
                    button.disabled = false;
                    button.textContent = "Download as PDF";
                    pdfBusy = false;
                }).catch(function () {
                    button.disabled = false;
                    button.textContent = "Could not make the PDF";
                    pdfBusy = false;
                });
            }

            buildSizers();
            render(false);
            if (window.ShapeCompletePdf) window.ShapeCompletePdf.load();
        })();
    </script>
    <script src="../assets/site-meta.js"></script>
    <script src="../assets/site-oer-footer.js"></script>
</body>
