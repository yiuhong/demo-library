name: Check catalog links

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check catalog and track links
        run: python3 scripts/check_catalog.py
      - name: Check vendor pins
        run: python3 scripts/check_vendor.py
      - name: Check fullscreen scroll
        run: python3 scripts/check_fullscreen_scroll.py
