<html lang="en">
<head>
    <title>Guided Tracks - Teaching Materials Library</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

    <style>
        /* Monochrome cards and chips, matching index.html. The site stylesheet
           forces black text on white, so these rules use !important only where
           that stylesheet does. */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 16.5rem), 1fr));
            gap: 0.9em;
            align-items: stretch;
        }

        a.demo-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.45em;
            height: 100%;
            min-height: 8.5em;
            padding: 1.05em 1.1em 1em;
            background: #ffffff;
            border: 1px solid #000000 !important;
            border-radius: 4px;
            color: #000000 !important;
            text-align: left;
            text-decoration: none;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        a.demo-card:hover,
        a.demo-card:focus-visible {
            background: #000000;
            border-bottom-color: #000000 !important;
            color: #ffffff !important;
        }

        a.demo-card:focus {
            outline: none;
        }

        a.demo-card:focus-visible {
            outline: 2px solid #000000;
            outline-offset: 3px;
        }

        .demo-card-title {
            font-weight: bold;
            font-size: 1.05em;
            line-height: 1.35;
            color: #000000 !important;
        }

        p.demo-card-desc {
            margin: 0;
            font-size: 0.82em;
            line-height: 1.45;
            color: #222222 !important;
        }

        .demo-card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4em;
            margin-top: auto;
            padding-top: 0.35em;
        }

        .demo-tag {
            display: inline-block;
            border: 1px solid #000000;
            border-radius: 2px;
            padding: 0.12em 0.45em;
            font-size: 0.68em;
            font-weight: bold;
            letter-spacing: 0.04em;
            line-height: 1.4;
            text-transform: uppercase;
            color: #000000 !important;
        }

        .demo-tag.is-draft {
            background: #000000;
            border-color: #000000;
            color: #ffffff !important;
        }

        a.demo-card:hover .demo-card-title,
        a.demo-card:hover p.demo-card-desc,
        a.demo-card:focus-visible .demo-card-title,
        a.demo-card:focus-visible p.demo-card-desc,
        a.demo-card:hover .demo-tag,
        a.demo-card:focus-visible .demo-tag {
            color: #ffffff !important;
            border-color: #ffffff;
        }

        a.demo-card:hover .demo-tag.is-draft,
        a.demo-card:focus-visible .demo-tag.is-draft {
            background: #ffffff;
            color: #000000 !important;
            border-color: #ffffff;
        }

        .sub-category-section {
            margin-bottom: 1.25em;
            background: #f6f6f6;
            padding: 1.25em 1.25em 0.35em;
            border-radius: 4px;
            border-left: 4px solid #000000;
        }

        .tracks-message {
            text-align: left;
            font-style: italic;
            padding: 1.25em 1.35em;
            background: #f6f6f6;
            border-radius: 4px;
            border-left: 4px solid #000000;
            margin: 0 0 1.5em 0;
        }

        .tracks-hub-heading,
        .track-title-row h2 {
            margin: 0;
            scroll-margin-top: 4.5em;
        }

        .tracks-hub-heading {
            margin-bottom: 0.85em;
        }

        .track-title-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.55em 0.75em;
            margin: 0 0 0.65em 0;
        }

        .track-title-row h2:focus {
            outline: none;
        }

        .track-title-row h2:focus-visible,
        .tracks-hub-heading:focus-visible {
            outline: 2px solid #000000;
            outline-offset: 3px;
        }

        p.track-summary {
            margin: 0 0 1.25em 0;
        }

        a.tracks-back {
            display: inline-block;
            margin: 0 0 1.25em 0;
            padding: 0.55em 1.05em;
            border: 1px solid #000000 !important;
            border-radius: 3em;
            background: #ffffff;
            color: #000000 !important;
            font-size: 0.78em;
            font-weight: bold;
            letter-spacing: 0.01em;
            line-height: 1.35;
            text-decoration: none;
        }

        a.tracks-back:hover,
        a.tracks-back:focus-visible {
            background: #000000;
            border-bottom-color: #000000 !important;
            color: #ffffff !important;
        }

        a.tracks-back:focus {
            outline: none;
        }

        a.tracks-back:focus-visible {
            outline: 2px solid #000000;
            outline-offset: 3px;
        }

        ol.track-steps {
            list-style: decimal;
            margin: 0;
            padding: 0 0 0 1.35em;
        }

        ol.track-steps > li {
            margin: 0;
            padding: 0 0 1.1em 0.35em;
            border-bottom: 1px solid #000000;
        }

        ol.track-steps > li + li {
            padding-top: 1.05em;
        }

        ol.track-steps > li:last-child {
            border-bottom: 0;
        }

        ol.track-steps > li::marker {
            font-weight: bold;
        }

        a.track-step-title,
        span.track-step-title {
            font-weight: bold;
            font-size: 1.05em;
            line-height: 1.35;
        }

        p.track-step-note {
            margin: 0.35em 0 0 0;
            font-size: 0.95em;
            line-height: 1.45;
        }

        .track-step-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 0.75em 1.5em;
            margin-top: 0.75em;
        }

        a.step-jump {
            display: block;
            max-width: 18rem;
            border-bottom: 0 !important;
            color: #000000 !important;
            text-decoration: none;
        }

        a.step-jump:hover,
        a.step-jump:focus-visible {
            color: #000000 !important;
        }

        a.step-jump:focus {
            outline: none;
        }

        a.step-jump:focus-visible {
            outline: 2px solid #000000;
            outline-offset: 3px;
        }

        .step-jump-kicker {
            display: block;
            font-size: 0.68em;
            font-weight: bold;
            letter-spacing: 0.04em;
            line-height: 1.4;
            text-transform: uppercase;
        }

        .step-jump-title {
            display: inline;
            border-bottom: 1px dotted rgba(0, 0, 0, 0.45);
        }

        a.step-jump:hover .step-jump-title,
        a.step-jump:focus-visible .step-jump-title {
            border-bottom-color: transparent;
        }

        @media screen and (max-width: 736px) {
            .sub-category-section {
                padding: 1em 1em 0.2em;
            }

            a.demo-card {
                min-height: 0;
            }

            a.step-jump {
                max-width: none;
                text-align: left;
            }
        }
    </style>
</head>
<body class="is-preload">

    <!-- Sidebar -->
    <section id="sidebar">
        <div class="inner">
            <nav>
                <ul>
                    <li><a href="index.html">Teaching Materials Library</a></li>
                </ul>
            </nav>
        </div>
    </section>

    <!-- Wrapper -->
    <div id="wrapper">

        <section id="intro" class="wrapper style1 fade-up">
            <div class="inner">
                <h1>Guided Tracks</h1>
                <p>Optional playlists through the demos. The full catalog can be found in the <a href="index.html">Teaching Materials Library</a>.</p>
            </div>
        </section>

        <section class="wrapper style2 fade-up">
            <div class="inner">
                <div id="tracks-root" aria-live="polite">
                    <p>Loading tracks…</p>
                </div>
                <noscript>
                    <p class="tracks-message">Guided tracks need JavaScript.</p>
                </noscript>
            </div>
        </section>

    </div>

    <!-- Footer -->
    <footer id="footer" class="wrapper style1-alt">
        <div class="inner">
            <ul class="menu">
                <li>&copy; Yiu Hong Ko 2026. All rights reserved.</li>
                <li>Design: <a href="http://html5up.net">HTML5 UP</a></li>
            </ul>
        </div>
    </footer>

    <!-- Scripts with absolute links pointing to the main website -->
    <script src="https://yiuhong.github.io/assets/js/jquery.min.js"></script>
    <script src="https://yiuhong.github.io/assets/js/jquery.scrollex.min.js"></script>
    <script src="https://yiuhong.github.io/assets/js/jquery.scrolly.min.js"></script>
    <script src="https://yiuhong.github.io/assets/js/browser.min.js"></script>
    <script src="https://yiuhong.github.io/assets/js/breakpoints.min.js"></script>
    <script src="https://yiuhong.github.io/assets/js/util.js"></script>
    <script src="https://yiuhong.github.io/assets/js/main.js"></script>

    <!-- Playlists live in tracks.json. Edit that file to insert, remove, or reorder steps. -->
    <script>
        (function () {
            'use strict';

            var root = document.getElementById('tracks-root');
            var tracks = [];
            var tracksReady = false;
            var baseTitle = document.title;

            function el(tag, className, text) {
                var node = document.createElement(tag);
                if (className) node.className = className;
                if (text != null) node.textContent = text;
                return node;
            }

            function clear(node) {
                while (node.firstChild) node.removeChild(node.firstChild);
            }

            function safeHref(href) {
                if (typeof href !== 'string') return '';
                var value = href.trim();
                if (!value || value.length > 300) return '';
                if (/[\s\\]/.test(value)) return '';
                if (/^[a-z][a-z0-9+.-]*:/i.test(value)) return '';
                if (value.indexOf('//') === 0) return '';
                if (value.indexOf('..') !== -1) return '';
                return value;
            }

            function normalizeStep(raw) {
                if (!raw || typeof raw !== 'object') return null;
                var title = typeof raw.title === 'string' ? raw.title.trim() : '';
                var href = safeHref(raw.href);
                var note = typeof raw.note === 'string' ? raw.note.trim() : '';
                if (!title && !href) return null;
                return {
                    title: title || href,
                    href: href,
                    note: note
                };
            }

            function normalizeTrack(raw) {
                if (!raw || typeof raw !== 'object') return null;
                var id = typeof raw.id === 'string' ? raw.id.trim() : '';
                var title = typeof raw.title === 'string' ? raw.title.trim() : '';
                if (!id || !title) return null;
                var summary = typeof raw.summary === 'string' ? raw.summary.trim() : '';
                var status = typeof raw.status === 'string' ? raw.status.trim().toLowerCase() : '';
                var steps = Array.isArray(raw.steps) ? raw.steps.map(normalizeStep).filter(Boolean) : [];
                return {
                    id: id,
                    title: title,
                    summary: summary,
                    status: status === 'ready' ? 'ready' : 'draft',
                    steps: steps
                };
            }

            function normalizeTracks(data) {
                var list = Array.isArray(data) ? data : (data && Array.isArray(data.tracks) ? data.tracks : null);
                if (!list) {
                    throw new Error('Tracks could not be loaded.');
                }
                return list.map(normalizeTrack).filter(Boolean);
            }

            function stepCountLabel(count) {
                return count === 1 ? '1 step' : count + ' steps';
            }

            function trackUrl(id) {
                return '?track=' + encodeURIComponent(id) + '#track-' + encodeURIComponent(id);
            }

            function trackIdFromLocation() {
                var params = new URLSearchParams(window.location.search);
                if (params.has('track')) return (params.get('track') || '').trim();
                var hash = window.location.hash.replace(/^#/, '');
                if (!hash) return '';
                try {
                    hash = decodeURIComponent(hash);
                } catch (err) {}
                if (hash.indexOf('track-') === 0) return hash.slice('track-'.length).trim();
                return '';
            }

            function findTrack(id) {
                for (var i = 0; i < tracks.length; i++) {
                    if (tracks[i].id === id) return tracks[i];
                }
                return null;
            }

            function samePageClick(event) {
                if (event.defaultPrevented || event.button !== 0) return false;
                if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return false;
                return true;
            }

            function followInPage(anchor, event) {
                if (!samePageClick(event)) return;
                event.preventDefault();
                history.pushState(null, '', anchor.getAttribute('href'));
                render({ moveFocus: true });
            }

            function draftBadge() {
                return el('span', 'demo-tag is-draft', 'Draft');
            }

            function renderHub(requestedId, moveFocus) {
                var hub = el('section', 'tracks-hub');
                var heading = el('h2', 'tracks-hub-heading', 'All tracks');
                heading.id = 'tracks-hub-heading';
                heading.tabIndex = -1;
                hub.appendChild(heading);
                hub.setAttribute('aria-labelledby', 'tracks-hub-heading');

                if (requestedId) {
                    hub.appendChild(el('p', 'tracks-message', 'That track was not found.'));
                }

                if (!tracks.length) {
                    hub.appendChild(el('p', 'tracks-message', 'No tracks yet.'));
                    root.appendChild(hub);
                    document.title = baseTitle;
                    if (moveFocus) heading.focus();
                    return;
                }

                var grid = el('div', 'card-grid');
                tracks.forEach(function (track) {
                    var card = el('a', 'demo-card track-card');
                    card.href = trackUrl(track.id);
                    card.setAttribute('data-track-id', track.id);
                    card.appendChild(el('span', 'demo-card-title', track.title));
                    if (track.summary) card.appendChild(el('p', 'demo-card-desc', track.summary));
                    var tags = el('span', 'demo-card-tags');
                    tags.appendChild(el('span', 'demo-tag', stepCountLabel(track.steps.length)));
                    if (track.status === 'draft') tags.appendChild(draftBadge());
                    card.appendChild(tags);
                    card.addEventListener('click', function (event) {
                        followInPage(card, event);
                    });
                    grid.appendChild(card);
                });
                hub.appendChild(grid);
                root.appendChild(hub);
                document.title = baseTitle;
                if (moveFocus) heading.focus();
            }

            function stepHeading(step) {
                if (!step.href) return el('span', 'track-step-title', step.title);
                var link = el('a', 'track-step-title', step.title);
                link.href = step.href;
                return link;
            }

            function previousLink(step) {
                var link = el('a', 'step-jump');
                link.href = step.href;
                link.rel = 'prev';
                link.appendChild(el('span', 'step-jump-kicker', 'Previous'));
                link.appendChild(el('span', 'step-jump-title', step.title));
                return link;
            }

            function renderTrack(track, moveFocus, scrollIntoView) {
                var section = el('section', 'track-detail');
                var back = el('a', 'tracks-back', 'All tracks');
                back.href = 'tracks.html';
                back.addEventListener('click', function (event) {
                    followInPage(back, event);
                });
                section.appendChild(back);

                var titleRow = el('div', 'track-title-row');
                var heading = el('h2', null, track.title);
                heading.id = /^[A-Za-z][\w-]*$/.test(track.id) ? 'track-' + track.id : 'track-heading';
                heading.tabIndex = -1;
                titleRow.appendChild(heading);
                titleRow.appendChild(el('span', 'demo-tag', stepCountLabel(track.steps.length)));
                if (track.status === 'draft') titleRow.appendChild(draftBadge());
                section.appendChild(titleRow);
                section.setAttribute('aria-labelledby', heading.id);

                if (track.summary) section.appendChild(el('p', 'track-summary', track.summary));

                var panel = el('div', 'sub-category-section');
                if (!track.steps.length) {
                    panel.appendChild(el('p', 'track-step-note', 'This track has no steps yet.'));
                } else {
                    var list = el('ol', 'track-steps');
                    track.steps.forEach(function (step, index) {
                        var item = el('li', 'track-step');
                        item.appendChild(stepHeading(step));
                        if (step.note) item.appendChild(el('p', 'track-step-note', step.note));
                        var previous = index > 0 ? track.steps[index - 1] : null;
                        if (previous && previous.href) {
                            var nav = el('div', 'track-step-nav');
                            nav.appendChild(previousLink(previous));
                            item.appendChild(nav);
                        }
                        list.appendChild(item);
                    });
                    panel.appendChild(list);
                }
                section.appendChild(panel);
                root.appendChild(section);
                document.title = track.title + ' - Guided Tracks';
                if (moveFocus) heading.focus();
                else if (scrollIntoView) heading.scrollIntoView({ block: 'start' });
            }

            function render(options) {
                var moveFocus = !!(options && options.moveFocus);
                var scrollIntoView = !!(options && options.scrollIntoView);
                var requestedId = trackIdFromLocation();
                clear(root);
                if (!requestedId) {
                    renderHub('', moveFocus);
                    return;
                }
                var track = findTrack(requestedId);
                if (!track) {
                    renderHub(requestedId, moveFocus);
                    return;
                }
                renderTrack(track, moveFocus, scrollIntoView);
            }

            function showError(message) {
                clear(root);
                root.appendChild(el('p', 'tracks-message', message));
            }

            function loadTracks() {
                var tracksUrl = new URL('tracks.json', window.location.href);
                tracksUrl.search = '';
                tracksUrl.hash = '';
                return fetch(tracksUrl.toString()).then(function (response) {
                    if (!response.ok) throw new Error('Tracks could not be loaded.');
                    return response.json();
                }).then(function (data) {
                    tracks = normalizeTracks(data);
                    tracksReady = true;
                    render({ scrollIntoView: true });
                }).catch(function () {
                    showError('Tracks could not be loaded.');
                });
            }

            window.addEventListener('popstate', function () {
                if (tracksReady) render();
            });
            window.addEventListener('hashchange', function () {
                if (tracksReady) render();
            });

            loadTracks();
        })();
    </script>
</body>
</html>
