<!DOCTYPE HTML>
<!--
	Guided Tracks is a view of the Teaching Materials Library.
	This page keeps older links working and does not draw a second site menu.
	The library page (index.html) owns the sidebar.
-->
<html lang="en">
<head>
    <title>Guided Tracks - Teaching Materials Library</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="https://yiuhong.github.io/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="index.html?view=tracks" />
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            params.delete('view');
            var query = ['view=tracks'];
            params.forEach(function (value, key) {
                query.push(encodeURIComponent(key) + '=' + encodeURIComponent(value));
            });
            window.location.replace('index.html?' + query.join('&') + window.location.hash);
        })();
    </script>
</head>
<body>
    <p><a id="tracks-library-link" href="index.html?view=tracks">Guided Tracks</a> open in the Teaching Materials Library.</p>
</body>
</html>
